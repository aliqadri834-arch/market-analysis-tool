name: Update market signals

on:
  schedule:
    # Every 30 min, 13:00-21:30 UTC, Mon-Fri. This window covers 9:30am-4pm ET
    # across both EST and EDT with margin; main.py's own market-hours check
    # (America/New_York) is the authoritative filter, so off-hours firings
    # here just exit early without committing anything.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market analysis
        run: python main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market signals"
            git push
          fi
